name: build

on:
  push:
  workflow_dispatch:
    inputs:
      use-cache:
        type: boolean
        default: true
        description: Use binary cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-maadeps:
    strategy:
      matrix:
        os: [ubuntu, windows, macos]
        arch: [x64, arm64]
        include:
          - os: ubuntu
            arch: arm64-android
          - os: ubuntu
            arch: x64-android
      fail-fast: false
    defaults:
      run:
        shell: bash
    env:
      ENABLE_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.use-cache) }}
      VCPKG_KEEP_ENV_VARS: "CMAKE_C_COMPILER_LAUNCHER;CMAKE_CXX_COMPILER_LAUNCHER;CCACHE_DIR;CCACHE_BASEDIR;CCACHE_COMPILERCHECK;ccache_symlinks_path;ANDROID_CCACHE;NDK_CCACHE"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    # Pin macOS to macos-15 (Apple Silicon). GitHub is rolling macos-latest over
    # to macos-26 (Xcode 26.5 / AppleClang 21), whose libc++ marks is_pod /
    # is_floating_point / is_signed / is_unsigned [[no_specializations]] and breaks
    # maa-fastdeploy float16.h. Stopgap until the float16 patch covers Apple libc++>=19.
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || format('{0}-latest', matrix.os) }}
    timeout-minutes: 720
    steps:
      - name: (Windows) Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "D:\a", "C:\actions-runner"
          Add-MpPreference -ExclusionProcess "cl.exe", "link.exe", "ninja.exe", "vcpkg.exe", "ccache.exe"
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

      - name: (Windows) Configure pagefile
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "D:"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: (Linux) Install dependencies via apt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build python3-pyelftools elfutils patchelf nasm ccache
          sudo apt-get install -y autoconf automake autoconf-archive

      - name: (Linux) Fetch toolchain and set OBJCOPY
        if: runner.os == 'Linux' && !contains(matrix.arch, 'android')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 linux-toolchain-download.py ${{ matrix.arch }}
          echo "OBJCOPY=$(pwd)/x-tools/llvm/bin/llvm-objcopy" >> $GITHUB_ENV

      - name: (Android) Setup Android NDK
        if: contains(matrix.arch, 'android')
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: (macOS) Install dependencies via Homebrew
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ccache ninja pkg-config nasm bison
          brew install autoconf automake autoconf-archive
          brew install bash gnu-sed gnu-tar
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix)/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH
          brew uninstall cmake

      - name: (macOS) Install CMake 3.31
        if: runner.os == 'macOS'
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-macos-universal.tar.gz
          tar zxf cmake-3.31.8-macos-universal.tar.gz
          mv cmake-3.31.8-macos-universal/CMake.app .
          rm -rf cmake-3.31.8-macos-universal cmake-3.31.8-macos-universal.tar.gz
          echo "PATH=$(pwd)/CMake.app/Contents/bin:$PATH" >> $GITHUB_ENV
          ./CMake.app/Contents/bin/cmake --version


      - name: Cache vcpkg binary archives
        if: env.ENABLE_CACHE == 'true'
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/archives/
          key: cache-archives-${{ matrix.os }}-${{ matrix.arch }}-${{ hashfiles('vcpkg-overlay/**', 'vcpkg*.json') }}
          restore-keys: |
            cache-archives-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Setup vcpkg binary cache directory
        if: env.ENABLE_CACHE == 'true'
        run: |
          mkdir -p vcpkg/archives

      - name: (Windows) Setup MSVC developer environment
        if: matrix.os == 'windows'
        id: msvc-env
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64${{ matrix.arch != 'x64' && format('_{0}', matrix.arch) || '' }}

      - name: (Windows) Configure MSVC compiler environment
        if: matrix.os == 'windows'
        run: |
          echo "CC=cl" >> $GITHUB_ENV
          echo "CXX=cl" >> $GITHUB_ENV

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          windows_compile_environment: ${{ matrix.os == 'windows' && 'msvc' || '' }}
          override_cache_key: ccache-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          override_cache_key_fallback: |
            ccache-${{ matrix.os }}-${{ matrix.arch }}-
          ccache_options: |
            max_size=1.0G

      - name: Configure ccache compiler launcher path
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            CCACHE_BIN=$(which ccache 2>/dev/null || true)
            if [ -z "$CCACHE_BIN" ] && [ -n "$ccache_symlinks_path" ] && [ -f "$ccache_symlinks_path/ccache.exe" ]; then
              CCACHE_BIN="$ccache_symlinks_path/ccache.exe"
            fi
            if [ -n "$CCACHE_BIN" ]; then
              CCACHE_PATH=$(cygpath -m "$CCACHE_BIN")
            fi
          else
            CCACHE_PATH=$(which ccache)
          fi
          if [ -n "$CCACHE_PATH" ]; then
            echo "CMAKE_C_COMPILER_LAUNCHER=${CCACHE_PATH}" >> $GITHUB_ENV
            echo "CMAKE_CXX_COMPILER_LAUNCHER=${CCACHE_PATH}" >> $GITHUB_ENV
          fi

      - name: Configure target platform
        run: |
          lower() { printf '%s\n' "${1,,}"; }

          if [[ "${{matrix.arch}}" == *"android"* ]]; then
            echo "TARGET=${{ matrix.arch }}" >> $GITHUB_ENV
          else
            export RUNNER_OS=$(lower ${{runner.os}})
            export OS=$(echo $RUNNER_OS | sed 's/macOS/osx/I')
            echo "TARGET=${{ matrix.arch }}-${OS}" >> $GITHUB_ENV
          fi

      - name: Build MaaDeps
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          for attempt in 1 2 3
          do
            python3 build.py --tarball --target maa-$TARGET -- $MAA_CMAKE_ARGS && break
            # delete object and archive files (of already installed packages) and retry
            shopt -s globstar nullglob
            df -lh
            rm -f vcpkg/buildtrees/**/*.{o,obj,a,lib}
            df -lh
            du -sh vcpkg/buildtrees/*
            [[ $attempt != 3 ]]  # fail on last attempt
          done

      - name: Collect build logs
        if: always()
        run: |
          shopt -s globstar
          tar caf logs.tar --ignore-failed-read vcpkg/buildtrees/**/*.log

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ env.TARGET }}
          path: logs.tar
          compression-level: 0

      - name: Upload release tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ env.TARGET }}
          path: tarball
          compression-level: 0

      - name: (Release) Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" --prerelease || true  # accept existing release
          gh release upload "$TAG_NAME" tarball/*
